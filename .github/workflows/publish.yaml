name: Publish to pub.dev

# Runs when a version tag is pushed. Needs automated publishing enabled on
# pub.dev (Admin tab) for this repository with tag pattern `v{{version}}`.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  publish:
    permissions:
      id-token: write # OIDC token that pub.dev exchanges for publish rights
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
